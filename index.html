              id: demoAlerts.length + 1,
              alert_code: `ALT-2026-0${demoAlerts.length + 1}`,
              title: isQuarantined ? `High Risk Ingestion Intercepted (${filename})` : `Suspicious Transfer Heuristic Triggered`,
              description: `Automated detection engine flagged transfer of ${filename} to ${destIp} (${protocol}). Computed risk score: ${risk}/100.`,
              severity: riskLevel,
              risk_score: risk,
              status: "OPEN",
              source_ip: "10.0.0.10",
              destination_ip: destIp,
              filename: filename,
              notes: isQuarantined ? "Payload automatically locked in quarantine storage." : "Monitored egress.",
              created_at: new Date().toISOString()
            };
            demoAlerts.unshift(newAlert);
            demoStats.total_alerts += 1;
            demoStats.open_alerts += 1;
            if (riskLevel === "CRITICAL") demoStats.critical_alerts += 1;
          }

          // Add audit log
          demoAuditLogs.unshift({
            id: demoAuditLogs.length + 1,
            action: "FILE_UPLOAD",
            username: activeDemoUser.username,
            resource_type: "FILE_TRANSFER",
            resource_id: String(newTransfer.id),
            ip_address: "127.0.0.1",
            status: "SUCCESS",
            details_json: { filename, protocol, risk_score: risk, status },
            created_at: new Date().toISOString()
          });

          return jsonResponse(newTransfer, 201);
        }

        if (urlStr.includes('/download')) {
          return new Response(new Blob(["SENTINEL SOC - SECURE VERIFIED CONTENT"]), {
            status: 200,
            headers: { 'Content-Type': 'application/octet-stream' }
          });
        }

        if (urlStr.includes('/transfers')) {
          return jsonResponse({ items: demoTransfers, total: demoTransfers.length, page: 1, limit: 50 });
        }

        // 4. Alerts routes
        if (urlStr.includes('/alerts') && method === 'PATCH') {
          const alertIdMatch = urlStr.match(/\/alerts\/(\d+)\/status/);
          const alertId = alertIdMatch ? parseInt(alertIdMatch[1]) : null;
          let body = {};
          try { body = JSON.parse(init.body || '{}'); } catch(e){}

          let targetAlert = demoAlerts.find(a => a.id === alertId);
          if (targetAlert) {
            const oldStatus = targetAlert.status;
            targetAlert.status = body.status || targetAlert.status;
            if (body.analyst_notes !== undefined) targetAlert.notes = body.analyst_notes;

            if (oldStatus === 'OPEN' && targetAlert.status !== 'OPEN') {
              demoStats.open_alerts = Math.max(0, demoStats.open_alerts - 1);
              if (targetAlert.severity === 'CRITICAL') {
                demoStats.critical_alerts = Math.max(0, demoStats.critical_alerts - 1);
              }
            } else if (oldStatus !== 'OPEN' && targetAlert.status === 'OPEN') {
              demoStats.open_alerts += 1;
              if (targetAlert.severity === 'CRITICAL') {
                demoStats.critical_alerts += 1;
              }
            }

            demoAuditLogs.unshift({
              id: demoAuditLogs.length + 1,
              action: "ALERT_UPDATED",
              username: activeDemoUser.username,
              resource_type: "SECURITY_ALERT",
              resource_id: String(targetAlert.id),
              ip_address: "127.0.0.1",
              status: "SUCCESS",
              details_json: { old_status: oldStatus, new_status: targetAlert.status, notes: targetAlert.notes },
              created_at: new Date().toISOString()
            });

            return jsonResponse(targetAlert);
          }
          return jsonResponse({ detail: "Alert not found" }, 404);
        }

        if (urlStr.includes('/alerts')) {
          return jsonResponse({ items: demoAlerts, total: demoAlerts.length, page: 1, limit: 50 });
        }

        // 5. Rules routes
        if (urlStr.includes('/rules') && method === 'PATCH') {
          const ruleIdMatch = urlStr.match(/\/rules\/(\d+)/);
          const ruleId = ruleIdMatch ? parseInt(ruleIdMatch[1]) : null;
          let body = {};
          try { body = JSON.parse(init.body || '{}'); } catch(e){}

          let targetRule = demoRules.find(r => r.id === ruleId);
          if (targetRule) {
            if (body.is_enabled !== undefined) targetRule.is_enabled = body.is_enabled;
            return jsonResponse(targetRule);
          }
          return jsonResponse({ detail: "Rule not found" }, 404);
        }

        if (urlStr.includes('/rules')) {
          return jsonResponse({ items: demoRules, total: demoRules.length });
        }

        // 6. Threat Intel
        if (urlStr.includes('/threat-intel/lookup')) {
          let body = {};
          try { body = JSON.parse(init.body || '{}'); } catch(e){}
          const ip = body.ip_address || "127.0.0.1";
          let existing = demoThreats.find(t => t.ip_address === ip);
          if (!existing) {
            let isBad = ip.startsWith('185.') || ip.startsWith('45.');
            existing = {
              id: demoThreats.length + 1,
              ip_address: ip,
              threat_level: isBad ? "MALICIOUS" : "CLEAN",
              reputation_score: isBad ? 85 : 0,
              source_provider: "Dynamic SOC Threat Evaluator",
              last_checked_at: new Date().toISOString()
            };
            demoThreats.unshift(existing);
          }
          return jsonResponse(existing);
        }

        if (urlStr.includes('/threat-intel')) {
          return jsonResponse({ items: demoThreats, total: demoThreats.length });
        }

        // 7. Audit logs
        if (urlStr.includes('/audit-logs')) {
          return jsonResponse({ items: demoAuditLogs, total: demoAuditLogs.length });
        }

        // 8. Reports downloads
        if (urlStr.includes('/reports/transfers/csv')) {
          let csv = "ID,UUID,Filename,Size_Bytes,Protocol,Destination_IP,Integrity,Risk_Score,Risk_Level,Status,Created_At\n";
          demoTransfers.forEach(t => {
            csv += `${t.id},${t.transfer_uuid},"${t.filename}",${t.file_size_bytes},${t.protocol},${t.destination_ip},${t.integrity_status},${t.risk_score},${t.risk_level},${t.status},${t.created_at}\n`;
          });
          return new Response(new Blob([csv], { type: "text/csv;charset=utf-8;" }), { status: 200 });
        }

        if (urlStr.includes('/reports/audit/csv')) {
          let csv = "ID,Timestamp,Username,Action,Resource_Type,Resource_ID,IP_Address,Status\n";
          demoAuditLogs.forEach(l => {
            csv += `${l.id},${l.created_at},${l.username},${l.action},${l.resource_type},${l.resource_id},${l.ip_address},${l.status}\n`;
          });
          return new Response(new Blob([csv], { type: "text/csv;charset=utf-8;" }), { status: 200 });
        }

        if (urlStr.includes('/reports/')) {
          let reportText = `========================================================================\nSENTINEL SOC COMPLIANCE REPORT\nGenerated: ${new Date().toUTCString()}\nAuthority: Chief Information Security Officer (CISO)\nIntegrity Standard: NIST SP 800-53 / ISO 27001 / RFC 4180\n========================================================================\n\nTotal Transfers Audited: ${demoStats.total_transfers}\nQuarantined Payloads: ${demoStats.quarantined_count}\nIncidents Logged: ${demoStats.total_alerts} (Critical: ${demoStats.critical_alerts})\nClean Transmission Rate: 98.4%\n\nVerified Cryptographic SHA-256 Digest Hashes Validated.`;
          return new Response(new Blob([reportText], { type: "text/plain;charset=utf-8;" }), { status: 200 });
        }

        return realFetch(input, init);
      };

      // Mock WebSocket
      const RealWebSocket = window.WebSocket;
      window.WebSocket = function(url, protocols) {
        if (!window.__SENTINEL_DEMO_ACTIVE__) {
          try {
            return new RealWebSocket(url, protocols);
          } catch(e) {}
        }

        const fake = {
          readyState: 1,
          send: function(msg) {
            if (msg === "ping" && fake.onmessage) {
              setTimeout(() => fake.onmessage({ data: JSON.stringify({ type: "PONG" }) }), 50);
            }
          },
          close: function() {}
        };

        setTimeout(() => {
          if (fake.onopen) fake.onopen();
          if (fake.onmessage) {
            fake.onmessage({
              data: JSON.stringify({
                type: "INITIAL_SNAPSHOT",
                data: demoStats
              })
            });
          }
        }, 120);

        // Simulated telemetry interval
        let ticker = setInterval(() => {
          if (fake.onmessage && window.__SENTINEL_DEMO_ACTIVE__) {
            const sampleFiles = ["api_heartbeat.log", "analytics_sync.parquet", "syslog_stream.gz", "telemetry_ping.json"];
            const chosen = sampleFiles[Math.floor(Math.random()*sampleFiles.length)];
            const fakeEvent = {
              type: "TRANSFER_CREATED",
              data: {
                filename: chosen,
                risk_level: "LOW",
                risk_score: 5,
                protocol: "SFTP",
                status: "SUCCESS"
              }
            };
            fake.onmessage({ data: JSON.stringify(fakeEvent) });
          }
        }, 15000);

        fake.close = function() { clearInterval(ticker); };
        return fake;
      };

    })();

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // Configurable API & Mode Detection
    const IS_PAGES = window.location.hostname.includes('github.io') || window.location.protocol === 'file:';
    let savedApi = localStorage.getItem('sentinel_api_base');
    let API_BASE = savedApi !== null ? savedApi : (IS_PAGES ? '' : '/api');
    let WS_URL = API_BASE ? 
      API_BASE.replace(/^http/, 'ws') + '/ws/telemetry' : 
      (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + (window.location.host || '127.0.0.1:8000') + '/ws/telemetry';

    // Built-in Demo Credentials
    const USERS = {
      admin: { username: "admin", password: "AdminPassword@2026", role: "ADMIN", label: "Security Administrator" },
      analyst: { username: "analyst", password: "AnalystPassword@2026", role: "ANALYST", label: "SOC Lead Analyst" },
      user1: { username: "user1", password: "UserPassword@2026", role: "USER", label: "Standard Operator" },
    };

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [token, setToken] = useState(localStorage.getItem('sentinel_token') || '');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [wsConnected, setWsConnected] = useState(false);
      const [notifications, setNotifications] = useState([]);
      const [loading, setLoading] = useState(false);

      // Data States
      const [stats, setStats] = useState(null);
      const [transfers, setTransfers] = useState([]);
      const [alerts, setAlerts] = useState([]);
      const [rules, setRules] = useState([]);
      const [threatRecords, setThreatRecords] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]);
      const [selectedAlert, setSelectedAlert] = useState(null);
      const [isDemo, setIsDemo] = useState(window.__SENTINEL_DEMO_ACTIVE__ !== false);
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [customApiUrl, setCustomApiUrl] = useState(localStorage.getItem('sentinel_api_base') || '');

      useEffect(() => {
        window.__SENTINEL_UPDATE_MODE__ = (val) => setIsDemo(val);
      }, []);

      // WebSocket Connection
      useEffect(() => {
        let ws;
        let reconnectTimeout;

        function connect() {
          try {
            ws = new WebSocket(WS_URL);
            ws.onopen = () => {
              setWsConnected(true);
              console.log("[SENTINEL SOC] Real-time telemetry stream connected.");
            };
            ws.onmessage = (event) => {
              try {
                const message = JSON.parse(event.data);
                handleWsMessage(message);
              } catch (err) {
                console.error("WS Parse Error:", err);
              }
            };
            ws.onclose = () => {
              setWsConnected(false);
              reconnectTimeout = setTimeout(connect, 3000);
            };
            ws.onerror = () => {
              setWsConnected(false);
              ws.close();
            };
          } catch (e) {
            setWsConnected(false);
            reconnectTimeout = setTimeout(connect, 5000);
          }
        }

        connect();
        return () => {
          if (ws) ws.close();
          if (reconnectTimeout) clearTimeout(reconnectTimeout);
        };
      }, []);

      function handleWsMessage(msg) {
        if (msg.type === 'INITIAL_SNAPSHOT' && msg.data) {
          setStats(msg.data);
        } else if (msg.type === 'TRANSFER_CREATED') {
          showNotification(`New Transfer: ${msg.data.filename} (${msg.data.risk_level} Risk)`, 'info');
          fetchStats();
          fetchTransfers();
        } else if (msg.type === 'ALERT_TRIGGERED') {
          showNotification(`🚨 SECURITY ALERT: ${msg.data.title}`, 'danger');
          fetchStats();
          fetchAlerts();
        } else if (msg.type === 'ALERT_UPDATED') {
          showNotification(`Alert Updated: ${msg.data.title} -> ${msg.data.status}`, 'warning');
          fetchStats();
          fetchAlerts();
        }
      }

      function showNotification(text, type = 'info') {
        const id = Date.now();
        setNotifications((prev) => [{ id, text, type }, ...prev.slice(0, 4)]);
        setTimeout(() => {
          setNotifications((prev) => prev.filter((n) => n.id !== id));
        }, 5000);
      }

      // Initial Auth Check
      useEffect(() => {
        if (token) {
          fetchCurrentUser();
        } else {
          // Auto-login as Admin for seamless out-of-the-box demo
          loginAs('admin');
        }
      }, [token]);

      async function loginAs(userKey) {
        setLoading(true);
        const creds = USERS[userKey];
        try {
          const res = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: creds.username, password: creds.password })
          });
          if (res.ok) {
            const data = await res.json();
            setToken(data.access_token);
            localStorage.setItem('sentinel_token', data.access_token);
            showNotification(`Logged in as ${creds.label} (${creds.role})`, 'success');
          } else {
            showNotification('Authentication failed', 'danger');
          }
        } catch (e) {
          showNotification('Backend API unreachable', 'danger');
        } finally {
          setLoading(false);
        }
      }

      async function fetchCurrentUser() {
        try {
          const res = await fetch(`${API_BASE}/auth/me`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const user = await res.json();
            setCurrentUser(user);
            refreshAllData();
          } else {
            setCurrentUser(null);
            setToken('');
            localStorage.removeItem('sentinel_token');
          }
        } catch (e) {
          console.error(e);
        }
      }

      function refreshAllData() {
        fetchStats();
        fetchTransfers();
        fetchAlerts();
        fetchRules();
        fetchThreatRecords();
        fetchAuditLogs();
      }

      async function fetchStats() {
        if (!token) return;
        try {
          const res = await fetch(`${API_BASE}/monitoring/stats`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) setStats(await res.json());
        } catch (e) { console.error(e); }
      }

      async function fetchTransfers() {
        if (!token) return;
        try {
          const res = await fetch(`${API_BASE}/transfers?limit=25`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const data = await res.json();
            setTransfers(data.items || []);
          }
        } catch (e) { console.error(e); }
      }

      async function fetchAlerts() {
        if (!token) return;
        try {
          const res = await fetch(`${API_BASE}/alerts?limit=50`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const data = await res.json();
            setAlerts(data.items || []);
          }
        } catch (e) { console.error(e); }
      }

      async function fetchRules() {
        if (!token) return;
        try {
          const res = await fetch(`${API_BASE}/rules`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const data = await res.json();
            setRules(data.items || []);
          }
        } catch (e) { console.error(e); }
      }

      async function fetchThreatRecords() {
        if (!token) return;
        try {
          const res = await fetch(`${API_BASE}/threat-intel?limit=25`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const data = await res.json();
            setThreatRecords(data.items || []);
          }
        } catch (e) { console.error(e); }
      }

      async function fetchAuditLogs() {
        if (!token) return;
        try {
          const res = await fetch(`${API_BASE}/audit-logs?limit=50`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const data = await res.json();
            setAuditLogs(data.items || []);
          }
        } catch (e) { console.error(e); }

                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                  </svg>
                </div>
                <div>
                  <h1 className="text-lg font-bold tracking-wider text-white flex items-center gap-2">
                    SENTINEL <span className="text-soc-accent font-extrabold text-sm px-1.5 py-0.5 rounded bg-cyan-950 border border-cyan-800">SOC</span>
                  </h1>

                </div>

    // ==========================================
    // TAB 2: SECURE FILE TRANSFERS VIEW
    // ==========================================
    function TransfersView({ transfers, token, onRefresh, showToast }) {
      const [file, setFile] = useState(null);
      const [computedHash, setComputedHash] = useState('');
      const [destIp, setDestIp] = useState('10.0.0.5');
      const [destLabel, setDestLabel] = useState('Finance Vault Primary');
      const [protocol, setProtocol] = useState('SFTP');
      const [expectedHash, setExpectedHash] = useState('');
      const [uploading, setUploading] = useState(false);
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');

      // Automatic In-Browser SHA-256 Checksum Calculation
      async function handleFileSelect(e) {
        const selected = e.target.files[0];
        if (!selected) return;
        setFile(selected);
        setComputedHash('Computing SHA-256 cryptographic digest...');

        try {
          const buffer = await selected.arrayBuffer();
          const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
          setComputedHash(hashHex);
        } catch (err) {
          setComputedHash('Hash computation failed');
        }
      }

      async function handleUpload(e) {
        e.preventDefault();
        if (!file) {
          showToast('Please select a file to transmit', 'warning');
          return;
        }

        setUploading(true);
        const formData = new FormData();
        formData.append('file', file);
        formData.append('destination_ip', destIp);
        formData.append('destination_label', destLabel);
        formData.append('protocol', protocol);
        if (expectedHash.trim()) {
          formData.append('expected_hash', expectedHash.trim());
        }

        try {
          const res = await fetch(`${API_BASE}/transfers/upload`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` },
            body: formData
          });

          if (res.ok) {
            const data = await res.json();
            if (data.is_quarantined) {
              showToast(`⚠️ TRANSFER QUARANTINED! Integrity mismatch or policy violation (${data.filename})`, 'danger');
            } else {
              showToast(`✓ Transfer completed successfully (${data.filename})`, 'success');
            }
            setFile(null);
            setComputedHash('');
            setExpectedHash('');
            onRefresh();
          } else {
            const err = await res.json().catch(() => ({ detail: res.statusText || 'Policy violation' }));
            showToast(`Upload Rejected: ${err.detail || 'Policy violation'}`, 'danger');
          }
        } catch (e) {
          console.error("Upload failed:", e);
          showToast(`Network error during upload: ${e.message || 'Check connection or backend status'}`, 'danger');
        } finally {
          setUploading(false);
        }
      }

      async function downloadFile(transferId, filename) {
        try {
          const res = await fetch(`${API_BASE}/transfers/${transferId}/download`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            showToast(`Downloaded: ${filename}`, 'success');
          } else {
            const err = await res.json();
            showToast(`Download blocked: ${err.detail || 'Access denied'}`, 'danger');
          }
        } catch (e) {
          showToast('Failed to download file', 'danger');
        }
      }

      const filteredTransfers = transfers.filter(t => {
        const matchesStatus = filterStatus === 'ALL' || t.status === filterStatus;
        const matchesQuery = !searchQuery || 
          t.filename.toLowerCase().includes(searchQuery.toLowerCase()) ||
          t.destination_ip.includes(searchQuery) ||
          t.sha256_hash.includes(searchQuery);
        return matchesStatus && matchesQuery;
      });

      return (
        <div className="space-y-6">
          {/* File Ingestion Card */}
          <div className="bg-soc-card border border-soc-border rounded-xl p-6 shadow-xl">
            <h2 className="text-base font-bold text-white mb-4 flex items-center gap-2">
              <span className="text-soc-accent">🚀</span> Secure File Ingestion Engine
            </h2>

            <form onSubmit={handleUpload} className="space-y-4">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {/* File Dropzone */}
                <div className="border-2 border-dashed border-slate-700 hover:border-soc-accent rounded-xl p-6 text-center cursor-pointer transition flex flex-col items-center justify-center bg-slate-900/50">
                  <input
                    type="file"
                    id="fileInput"
                    onChange={handleFileSelect}
                    className="hidden"
                  />
                  <label htmlFor="fileInput" className="cursor-pointer space-y-2">
                    <div className="text-3xl text-cyan-400">📄</div>
                    <div className="text-sm font-semibold text-slate-200">
                      {file ? file.name : 'Click or drag file to transmit'}
                    </div>
                    <div className="text-xs text-slate-500">
                      Enforces MIME & Extension filtering, Anti-Path Traversal, and SHA-256 Digest
                    </div>
                  </label>
                  {computedHash && (
                    <div className="mt-3 w-full bg-slate-950 p-2 rounded text-[11px] font-mono text-cyan-400 break-all text-left border border-slate-800">
                      <span className="text-slate-500">SHA-256: </span>{computedHash}
                    </div>
                  )}
                </div>

                {/* Transfer Parameters */}
                <div className="space-y-3 bg-slate-900/40 p-4 rounded-xl border border-slate-800">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-mono text-slate-400 block mb-1">Destination IP</label>
                      <input
                        type="text"
                        value={destIp}
                        onChange={(e) => setDestIp(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs font-mono text-white focus:border-soc-accent outline-none"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-mono text-slate-400 block mb-1">Protocol</label>
                      <select
                        value={protocol}
                        onChange={(e) => setProtocol(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs font-mono text-white focus:border-soc-accent outline-none"
                      >
                        <option value="SFTP">SFTP (Port 22 - Secure)</option>
                        <option value="HTTPS">HTTPS (Port 443 - Secure)</option>
                        <option value="FTPS">FTPS (Port 990 - Secure)</option>
                        <option value="SCP">SCP (Port 22 - Secure)</option>
                        <option value="FTP">FTP (Port 21 - Insecure Rule Trigger)</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="text-xs font-mono text-slate-400 block mb-1">Destination Host Label</label>

                      type="text"
                      value={destLabel}

                      className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-white focus:border-soc-accent outline-none"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <label className="text-xs font-mono text-slate-400">Expected SHA-256 (Integrity Check)</label>
                      <div className="space-x-1">
                        <button
                          type="button"
                          onClick={() => setExpectedHash(computedHash)}
                          className="text-[10px] text-cyan-400 hover:underline"
                        >
                          Auto-Match
                        </button>
                        <span className="text-slate-600">•</span>
                        <button
                          type="button"
                          onClick={() => setExpectedHash('a'.repeat(64))}
                          className="text-[10px] text-rose-400 hover:underline"
                        >
                          Simulate Tampering
                        </button>
                      </div>
                    </div>
                    <input
                      type="text"
                      value={expectedHash}
                      onChange={(e) => setExpectedHash(e.target.value)}
                      placeholder="Optional client expected hash for verification"
                      className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs font-mono text-white focus:border-soc-accent outline-none"
                    />
                  </div>

                  {/* IP Testing Shortcuts */}
                  <div className="flex flex-wrap gap-1 text-[10px] font-mono">
                    <span className="text-slate-500 py-0.5">Subnet Presets:</span>
                    <button type="button" onClick={() => setDestIp('10.0.0.5')} className="px-1.5 py-0.5 bg-slate-800 text-slate-300 rounded hover:bg-slate-700">10.0.0.5 (Approved)</button>
                    <button type="button" onClick={() => setDestIp('192.168.1.100')} className="px-1.5 py-0.5 bg-slate-800 text-slate-300 rounded hover:bg-slate-700">192.168.1.100 (Approved)</button>
                    <button type="button" onClick={() => setDestIp('185.220.101.5')} className="px-1.5 py-0.5 bg-rose-950 text-rose-300 border border-rose-800 rounded hover:bg-rose-900">185.220.101.5 (External/Untrusted)</button>
                  </div>

                  <button
                    type="submit"
                    disabled={uploading || !file}
                    className={`w-full py-2.5 rounded-lg font-bold text-xs uppercase tracking-wider transition ${
                      uploading || !file
                        ? 'bg-slate-800 text-slate-500 cursor-not-allowed'
                        : 'bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white shadow-lg shadow-cyan-500/20'
                    }`}
                  >
                    {uploading ? 'Verifying & Ingesting Payload...' : 'Transmit & Inspect File'}
                  </button>
                </div>
              </div>
            </form>
          </div>

          {/* Transfers History Table */}
          <div className="bg-soc-card border border-soc-border rounded-xl p-5 shadow-xl space-y-4">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
              <h3 className="text-sm font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                <span>📑</span> File Transfer History & Integrity Log
              </h3>
              <div className="flex items-center gap-2 w-full sm:w-auto">
                <input
                  type="text"
                  placeholder="Search filename or IP..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-white outline-none focus:border-soc-accent"
                />
                <select
                  value={filterStatus}
                  onChange={(e) => setFilterStatus(e.target.value)}
                  className="bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs text-white outline-none focus:border-soc-accent"

    // ==========================================
    // TAB 3: INCIDENT & ALERT TRIAGE VIEW
    // ==========================================
    function AlertsView({ alerts, token, onRefresh, showToast, selectedAlert, setSelectedAlert }) {
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [filterSeverity, setFilterSeverity] = useState('ALL');
      const [notes, setNotes] = useState('');
      const [saving, setSaving] = useState(false);

      const filteredAlerts = alerts.filter(a => {
        const matchesStatus = filterStatus === 'ALL' || a.status === filterStatus;
        const matchesSeverity = filterSeverity === 'ALL' || a.severity === filterSeverity;
        return matchesStatus && matchesSeverity;
      });

      async function updateAlertStatus(alertId, newStatus, currentNotes) {
        setSaving(true);
        try {
          const res = await fetch(`${API_BASE}/alerts/${alertId}`, {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              status: newStatus,
              analyst_notes: currentNotes || undefined
            })
          });

          if (res.ok) {
            const updated = await res.json();
            showToast(`Incident #${alertId} updated to ${newStatus}`, 'success');
            setSelectedAlert(updated);
            onRefresh();
          } else {
            showToast('Permission denied: Analyst/Admin role required', 'danger');
          }
        } catch (e) {
          showToast('Failed to update incident', 'danger');
        } finally {
          setSaving(false);
        }
      }

      return (
        <div className="space-y-6">
          {/* Top Triage Stats */}
          <div className="bg-soc-card border border-soc-border rounded-xl p-5 shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <h2 className="text-base font-bold text-white flex items-center gap-2">
                <span>🚨</span> SOC Incident & Alert Triage Center
              </h2>
              <p className="text-xs text-slate-400 mt-1">
                Role-based incident state transitions (OPEN ➔ INVESTIGATING ➔ RESOLVED / FALSE_POSITIVE)
              </p>
            </div>

            {/* Filter Pills */}
            <div className="flex flex-wrap gap-2 text-xs">
              {['ALL', 'OPEN', 'INVESTIGATING', 'RESOLVED', 'FALSE_POSITIVE'].map((st) => (
                <button
                  key={st}
                  onClick={() => setFilterStatus(st)}
                  className={`px-3 py-1 rounded-md font-semibold transition ${
                    filterStatus === st
                      ? 'bg-soc-accent text-slate-950'
                      : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-700'
                  }`}
                >
                  {st}
                </button>
              ))}
            </div>
          </div>

          {/* Alerts Grid / Table */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* List Column */}
            <div className="lg:col-span-2 bg-soc-card border border-soc-border rounded-xl p-5 shadow-xl">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs text-slate-300">
                  <thead className="bg-slate-900 text-slate-400 uppercase font-mono text-[11px] border-b border-soc-border">
                    <tr>
                      <th className="py-2.5 px-3">Severity</th>
                      <th className="py-2.5 px-3">Incident Title</th>
                      <th className="py-2.5 px-3">Risk</th>
                      <th className="py-2.5 px-3">Status</th>
                      <th className="py-2.5 px-3 text-right">Action</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800">
                    {filteredAlerts.map((a) => (
                      <tr
                        key={a.id}
                        onClick={() => { setSelectedAlert(a); setNotes(a.analyst_notes || ''); }}
                        className={`hover:bg-slate-800/60 cursor-pointer transition ${
                          selectedAlert?.id === a.id ? 'bg-slate-800/80 border-l-2 border-soc-accent' : ''
                        }`}
                      >
                        <td className="py-3 px-3">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                            a.severity === 'CRITICAL' ? 'bg-rose-950 text-rose-300 border border-rose-800' :
                            a.severity === 'HIGH' ? 'bg-orange-950 text-orange-300 border border-orange-800' :
                            a.severity === 'MEDIUM' ? 'bg-amber-950 text-amber-300 border border-amber-800' :
                            'bg-cyan-950 text-cyan-300 border border-cyan-800'
                          }`}>
                            {a.severity}
                          </span>
                        </td>
                        <td className="py-3 px-3">
                          <div className="text-white font-medium">{a.title}</div>
                          <div className="text-[10px] text-slate-500 font-mono">{new Date(a.created_at).toLocaleString()}</div>
                        </td>
                        <td className="py-3 px-3 font-mono font-bold text-rose-400">{a.risk_score}</td>
                        <td className="py-3 px-3">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                            a.status === 'OPEN' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' :
                            a.status === 'INVESTIGATING' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' :
                            a.status === 'RESOLVED' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' :
                            'bg-slate-800 text-slate-400'

                            {a.status}

                        </td>
                      </tr>
                    ))}
                    {filteredAlerts.length === 0 && (
                      <tr>
                        <td colSpan="5" className="py-12 text-center text-slate-500">

                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Incident Detail Drawer Column */}
            <div className="bg-soc-card border border-soc-border rounded-xl p-5 shadow-xl">
              {selectedAlert ? (
                <div className="space-y-4">
                  <div className="flex items-center justify-between pb-3 border-b border-soc-border">
                    <span className="text-xs font-mono text-slate-400">Incident #{selectedAlert.id}</span>
                    <span className={`px-2 py-0.5 rounded text-xs font-bold ${
                      selectedAlert.severity === 'CRITICAL' ? 'bg-rose-950 text-rose-300' : 'bg-amber-950 text-amber-300'
                    }`}>
                      {selectedAlert.severity}
                    </span>
                  </div>

                  <div>
                    <h3 className="text-sm font-bold text-white">{selectedAlert.title}</h3>
                    <div className="text-xs text-slate-400 mt-2 whitespace-pre-wrap bg-slate-900/60 p-3 rounded border border-slate-800 font-mono text-[11px]">
                      {selectedAlert.description}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2 text-xs font-mono">
                    <div className="bg-slate-900 p-2 rounded">
                      <div className="text-slate-500 text-[10px]">RISK SCORE</div>
                      <div className="text-lg font-bold text-rose-400">{selectedAlert.risk_score} / 100</div>
                    </div>
                    <div className="bg-slate-900 p-2 rounded">
                      <div className="text-slate-500 text-[10px]">CURRENT STATUS</div>
                      <div className="text-sm font-bold text-cyan-400">{selectedAlert.status}</div>
                    </div>
                  </div>

                  {/* State Transition Actions */}
                  <div className="space-y-2 pt-2 border-t border-soc-border">
                    <div className="text-xs font-bold text-slate-300 uppercase tracking-wider">Lifecycle Transitions</div>
                    <div className="grid grid-cols-3 gap-2">
                      <button
                        onClick={() => updateAlertStatus(selectedAlert.id, 'INVESTIGATING', notes)}
                        disabled={saving}
                        className="py-1.5 px-2 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold rounded text-xs transition"
                      >
                        Investigate
                      </button>
                      <button
                        onClick={() => updateAlertStatus(selectedAlert.id, 'RESOLVED', notes)}
                        disabled={saving}
                        className="py-1.5 px-2 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold rounded text-xs transition"
                      >
                        Resolve
                      </button>
                      <button
                        onClick={() => updateAlertStatus(selectedAlert.id, 'FALSE_POSITIVE', notes)}
                        disabled={saving}
                        className="py-1.5 px-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded text-xs transition"
                      >
                        False Pos
                      </button>
                    </div>
                  </div>

                  {/* Analyst Notes Editor */}
                  <div className="space-y-2 pt-2 border-t border-soc-border">
                    <label className="text-xs font-bold text-slate-300 uppercase tracking-wider block">
                      Analyst Forensic Notes
                    </label>
                    <textarea
                      rows="3"
                      value={notes}
                      onChange={(e) => setNotes(e.target.value)}
                      placeholder="Add investigation findings, root cause analysis, or firewall rules applied..."
                      className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-white outline-none focus:border-soc-accent"
                    ></textarea>
                    <button
                      onClick={() => updateAlertStatus(selectedAlert.id, selectedAlert.status, notes)}
                      disabled={saving}
                      className="w-full py-1.5 bg-soc-accent hover:bg-soc-accentHover text-slate-950 font-bold text-xs rounded transition"
                    >
                      {saving ? 'Updating...' : 'Save Investigation Findings'}
                    </button>
                  </div>
                </div>
              ) : (
                <div className="py-20 text-center text-slate-500 text-xs">
                  Select an incident from the triage queue to inspect telemetry and transition lifecycle.
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // TAB 4: SECURITY DETECTION RULES VIEW
    // ==========================================
    function RulesView({ rules, token, onRefresh, showToast }) {
      async function toggleRule(rule) {
        try {
          const res = await fetch(`${API_BASE}/rules/${rule.id}`, {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ is_enabled: !rule.is_enabled })
          });

          if (res.ok) {
            showToast(`Rule '${rule.rule_code}' ${!rule.is_enabled ? 'Enabled' : 'Disabled'}`, 'success');
            onRefresh();
          } else {
            showToast('Permission denied: Administrator role required', 'danger');
          }
        } catch (e) {
          showToast('Failed to update rule configuration', 'danger');
        }
      }

      return (
        <div className="space-y-6">
          <div className="bg-soc-card border border-soc-border rounded-xl p-5 shadow-lg flex justify-between items-center">
            <div>
              <h2 className="text-base font-bold text-white flex items-center gap-2">
                <span>🛡️</span> Security Rule Detection Engine
              </h2>
              <p className="text-xs text-slate-400 mt-1">
                Configure real-time behavioral heuristics, threshold triggers, and risk scoring weights.
              </p>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {rules.map((rule) => (
              <div
                key={rule.id}
                className={`bg-soc-card border rounded-xl p-5 shadow-lg flex flex-col justify-between transition ${
                  rule.is_enabled ? 'border-soc-border' : 'border-slate-800 opacity-60'
                }`}
              >
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-mono font-bold text-cyan-400">{rule.rule_code}</span>
                    <div className="flex items-center gap-2">
                      <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                        rule.severity === 'CRITICAL' ? 'bg-rose-950 text-rose-300' :
                        rule.severity === 'HIGH' ? 'bg-orange-950 text-orange-300' :
                        'bg-amber-950 text-amber-300'
                      }`}>
                        {rule.severity} (Weight: {rule.risk_weight})
                      </span>
                      <button
                        onClick={() => toggleRule(rule)}
                        className={`w-10 h-5 flex items-center rounded-full p-0.5 transition ${
                          rule.is_enabled ? 'bg-soc-accent justify-end' : 'bg-slate-700 justify-start'
                        }`}
                      >
                        <div className="w-4 h-4 rounded-full bg-white shadow-md"></div>
                      </button>
                    </div>
                  </div>

                  <h3 className="text-sm font-bold text-white">{rule.name}</h3>
                  <p className="text-xs text-slate-400 mt-1">{rule.description}</p>
                </div>

                <div className="mt-4 pt-3 border-t border-soc-border text-xs font-mono text-slate-400 bg-slate-900/60 p-2.5 rounded">
                  <span className="text-slate-500 font-sans text-[10px] uppercase font-bold block mb-1">Configuration Parameters</span>
                  <pre className="text-[11px] overflow-x-auto text-cyan-300">
                    {JSON.stringify(rule.condition_config || {}, null, 2)}
                  </pre>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ==========================================
    // TAB 5: THREAT INTELLIGENCE VIEW
    // ==========================================
    function ThreatIntelView({ records, token, onRefresh, showToast }) {
      const [ipInput, setIpInput] = useState('');
      const [lookupResult, setLookupResult] = useState(null);
      const [loading, setLoading] = useState(false);

      async function handleLookup(targetIp) {
        const ipToTest = targetIp || ipInput;
        if (!ipToTest.trim()) {
          showToast('Please enter an IP address', 'warning');
          return;
        }

        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/threat-intel/lookup`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ ip_address: ipToTest.trim() })
          });

          if (res.ok) {
            const data = await res.json();
            setLookupResult(data);
            showToast(`Threat intelligence verified for ${data.ip_address}`, 'info');
            onRefresh();
          } else {
            showToast('Lookup failed', 'danger');
          }
        } catch (e) {
          showToast('Failed to reach threat intelligence provider', 'danger');
        } finally {
          setLoading(false);
        }
      }

      return (
        <div className="space-y-6">
          <div className="bg-soc-card border border-soc-border rounded-xl p-5 shadow-lg">
            <h2 className="text-base font-bold text-white flex items-center gap-2">
              <span>🌐</span> Modular Threat Intelligence & IP Reputation
            </h2>
            <p className="text-xs text-slate-400 mt-1">
              Live IP reputation evaluation integrating AbuseIPDB, local high-speed cache, and built-in SOC signatures.
            </p>

            {/* Search Input & Quick Test Buttons */}
            <div className="mt-4 flex flex-col sm:flex-row gap-3">
              <input
                type="text"
                placeholder="Enter IPv4 / IPv6 address (e.g. 185.220.101.5)..."
                value={ipInput}
                onChange={(e) => setIpInput(e.target.value)}
                className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-xs font-mono text-white outline-none focus:border-soc-accent"
              />
              <button
                onClick={() => handleLookup()}
                disabled={loading}
                className="px-6 py-2 bg-soc-accent hover:bg-soc-accentHover text-slate-950 font-bold text-xs rounded-lg transition"
              >
                {loading ? 'Evaluating...' : 'Query Threat Feed'}
              </button>
            </div>

            <div className="flex flex-wrap gap-2 mt-3 text-xs font-mono">

              <button onClick={() => { setIpInput('185.220.101.5'); handleLookup('185.220.101.5'); }} className="px-2 py-1 bg-rose-950 text-rose-300 border border-rose-800 rounded hover:bg-rose-900">185.220.101.5 (Tor Exit Node - Malicious)</button>
              <button onClick={() => { setIpInput('45.154.255.88'); handleLookup('45.154.255.88'); }} className="px-2 py-1 bg-rose-950 text-rose-300 border border-rose-800 rounded hover:bg-rose-900">45.154.255.88 (Botnet C2)</button>
              <button onClick={() => { setIpInput('194.26.29.112'); handleLookup('194.26.29.112'); }} className="px-2 py-1 bg-amber-950 text-amber-300 border border-amber-800 rounded hover:bg-amber-900">194.26.29.112 (Scanner)</button>
            </div>
          </div>

          {/* Lookup Result Card */}
          {lookupResult && (
            <div className="bg-soc-card border border-soc-border rounded-xl p-5 shadow-xl">
              <div className="flex items-center justify-between mb-4">
                <div>
                  <div className="text-xs font-mono text-slate-400">TARGET REPUTATION PROFILE</div>
                  <div className="text-xl font-bold font-mono text-white mt-1">{lookupResult.ip_address}</div>
                </div>
                <span className={`px-3 py-1 rounded-md text-xs font-extrabold uppercase ${
                  lookupResult.threat_level === 'MALICIOUS' ? 'bg-rose-600 text-white shadow-lg shadow-rose-600/30' :
                  lookupResult.threat_level === 'SUSPICIOUS' ? 'bg-amber-600 text-white' :
                  'bg-emerald-600 text-white'

                  {lookupResult.threat_level}
                </span>

                <div className="bg-slate-900 p-3 rounded-lg border border-slate-800">
                  <div className="text-slate-500 text-[10px]">REPUTATION SCORE</div>
                  <div className="text-2xl font-bold text-white mt-1">{lookupResult.reputation_score} <span className="text-xs font-normal text-slate-500">/ 100</span></div>
                </div>
                <div className="bg-slate-900 p-3 rounded-lg border border-slate-800">
                  <div className="text-slate-500 text-[10px]">INTELLIGENCE PROVIDER</div>
                  <div className="text-sm font-semibold text-cyan-400 mt-1">{lookupResult.source_provider}</div>

                  <div className="text-xs text-slate-300 mt-1">{new Date(lookupResult.last_checked_at).toLocaleString()}</div>

                    <span key={idx} className="px-2.5 py-1 bg-slate-900 border border-slate-700 text-slate-300 rounded text-xs font-mono">

                  <tr>
                    <th className="py-2.5 px-3">IP Address</th>
                    <th className="py-2.5 px-3">Threat Level</th>
                    <th className="py-2.5 px-3">Score</th>
                    <th className="py-2.5 px-3">Provider</th>
                    <th className="py-2.5 px-3">Last Checked</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800">
                  {records.map((r) => (
                    <tr key={r.id} className="hover:bg-slate-800/40">
                      <td className="py-2.5 px-3 text-white font-bold">{r.ip_address}</td>
                      <td className="py-2.5 px-3">
                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                          r.threat_level === 'MALICIOUS' ? 'bg-rose-950 text-rose-300 border border-rose-800' :
                          r.threat_level === 'SUSPICIOUS' ? 'bg-amber-950 text-amber-300 border border-amber-800' :
                          'bg-emerald-950 text-emerald-300 border border-emerald-800'
                        }`}>
                          {r.threat_level}
                        </span>
                      </td>
                      <td className="py-2.5 px-3">{r.reputation_score}</td>
                      <td className="py-2.5 px-3 text-slate-400">{r.source_provider}</td>
                      <td className="py-2.5 px-3 text-slate-500">{new Date(r.last_checked_at).toLocaleString()}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // TAB 6: AUDIT TRAIL & REPORTS VIEW
    // ==========================================
    function AuditView({ logs, token, onRefresh, showToast }) {
      const [filterAction, setFilterAction] = useState('ALL');
      const [expandedLog, setExpandedLog] = useState(null);

      async function triggerDownload(endpoint, defaultFilename) {
        try {
          const res = await fetch(`${API_BASE}${endpoint}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = defaultFilename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            showToast(`Generated: ${defaultFilename}`, 'success');
          } else {
            showToast('Report export failed', 'danger');
          }
        } catch (e) {
          showToast('Failed to export compliance document', 'danger');
        }
      }

      const filteredLogs = logs.filter(l => filterAction === 'ALL' || l.action === filterAction);

      return (
        <div className="space-y-6">
          {/* Compliance Reporting Export Panel */}
          <div className="bg-gradient-to-r from-slate-900 to-slate-950 border border-soc-border rounded-xl p-5 shadow-xl">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <h2 className="text-base font-bold text-white flex items-center gap-2">
                  <span>📑</span> SOC Compliance & Executive Export Hub
                </h2>
                <p className="text-xs text-slate-400 mt-1">
                  Instant generation of formal PDF security audits and RFC 4180 CSV logs for external compliance auditors.
                </p>
              </div>

              {/* Action Buttons */}
              <div className="flex flex-wrap gap-2">
                <button
                  onClick={() => triggerDownload('/reports/transfers/pdf', 'transfers_audit_report.pdf')}
                  className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold text-xs rounded-lg border border-cyan-800 transition flex items-center gap-1.5 shadow"
                >
                  <span>📄</span> Download Transfers PDF
                </button>
                <button
                  onClick={() => triggerDownload('/reports/alerts/pdf', 'security_incidents_report.pdf')}
                  className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-rose-400 font-bold text-xs rounded-lg border border-rose-800 transition flex items-center gap-1.5 shadow"
                >
                  <span>🚨</span> Download Incidents PDF
                </button>
                <button
                  onClick={() => triggerDownload('/reports/transfers/csv', 'transfers_audit.csv')}
                  className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs rounded-lg border border-slate-700 transition flex items-center gap-1.5"
                >
                  <span>📊</span> Export Transfers CSV
                </button>
                <button
                  onClick={() => triggerDownload('/reports/audit/csv', 'soc_audit_logs.csv')}
                  className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs rounded-lg border border-slate-700 transition flex items-center gap-1.5"
                >
                  <span>📑</span> Export Audit CSV
                </button>
              </div>
            </div>
          </div>

          {/* Audit Logs Table */}
          <div className="bg-soc-card border border-soc-border rounded-xl p-5 shadow-xl space-y-4">
            <div className="flex justify-between items-center">
              <h3 className="text-sm font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                <span>🔒</span> Tamper-Evident Administrative Audit Log
              </h3>
              <select
                value={filterAction}
                onChange={(e) => setFilterAction(e.target.value)}
                className="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white outline-none"
              >
                <option value="ALL">All Actions</option>
                <option value="FILE_UPLOAD">FILE_UPLOAD</option>
                <option value="ALERT_GENERATED">ALERT_GENERATED</option>
                <option value="ALERT_UPDATED">ALERT_UPDATED</option>
                <option value="AUTH_LOGIN">AUTH_LOGIN</option>
                <option value="RULE_UPDATED">RULE_UPDATED</option>
              </select>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs text-slate-300 font-mono">
                <thead className="bg-slate-900 text-slate-400 uppercase text-[11px] border-b border-soc-border">
                  <tr>
                    <th className="py-2.5 px-3">Timestamp (UTC)</th>
                    <th className="py-2.5 px-3">Username</th>
                    <th className="py-2.5 px-3">Action</th>
                    <th className="py-2.5 px-3">Resource</th>
                    <th className="py-2.5 px-3">Client IP</th>
                    <th className="py-2.5 px-3">Status</th>
                    <th className="py-2.5 px-3 text-right">Details</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800">
                  {filteredLogs.map((l) => (
                    <React.Fragment key={l.id}>
                      <tr className="hover:bg-slate-800/40">
                        <td className="py-2 px-3 text-slate-400">{new Date(l.created_at).toISOString().replace('T', ' ').substring(0, 19)}</td>
                        <td className="py-2 px-3 text-cyan-300 font-semibold">{l.username || 'SYSTEM'}</td>
                        <td className="py-2 px-3 font-bold text-white">{l.action}</td>
                        <td className="py-2 px-3 text-slate-400">{l.resource_type}</td>
                        <td className="py-2 px-3 text-slate-500">{l.ip_address}</td>
                        <td className="py-2 px-3">
                          <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold ${
                            l.status === 'SUCCESS' ? 'text-emerald-400 bg-emerald-950' : 'text-rose-400 bg-rose-950'
                          }`}>
                            {l.status}
                          </span>
                        </td>
                        <td className="py-2 px-3 text-right">
                          <button
                            onClick={() => setExpandedLog(expandedLog === l.id ? null : l.id)}
                            className="text-xs text-cyan-400 hover:underline"
                          >
                            {expandedLog === l.id ? 'Hide' : 'Inspect'}
                          </button>
                        </td>
                      </tr>
                      {expandedLog === l.id && (
                        <tr className="bg-slate-950">
                          <td colSpan="7" className="p-3">
                            <pre className="text-[11px] text-cyan-300 overflow-x-auto p-2 bg-slate-900 rounded border border-slate-800">
                              {JSON.stringify(l.details_json, null, 2)}
                            </pre>
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // Render the Application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
